<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PH116 Exit Quiz</title>
<style>
body{font-family:system-ui,sans-serif;line-height:1.45;margin:0;padding:24px;background:radial-gradient(circle at top,#1b2745,#090a0f);color:#f2f2f2}
#quiz3{max-width:760px;margin:auto;background:#121212;border:1px solid #2c2c2c;border-radius:18px;padding:24px}
.progress-wrap{width:100%;height:10px;background:#222;border-radius:20px;overflow:hidden}
#progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#00d4ff,#00ff99)}
.q3_option{display:block;width:100%;margin:8px 0;padding:12px;background:#181818;color:#fff;border:1px solid #333;border-radius:10px;text-align:left;cursor:pointer}
.correct{color:#00ff88} .incorrect{color:#ff6666}
</style></head><body>
<div id="quiz3"><h1>PH116 Exit Quiz</h1><div>Chapter 2: Kinematics and Basic Wave Physics</div>
<div class="progress-wrap"><div id="progress-bar"></div></div>
<h3 id="p"></h3><div id="s"></div><div id="o"></div><div id="f"></div><button id="r">Restart</button></div>
<script>
const quiz3=[
{stem:'What two essential ingredients does the chapter say a function needs in order to represent a traveling wave?',choices:['A constant slope together with zero acceleration','The curvature of space together with acceleration','Only amplitude and wavelength','Only frequency and mass density'],correctIndex:1},
{stem:'When the del operator is dotted with a vector function, what scalar quantity does this produce?',choices:['Gradient','Curl','Divergence','Laplacian'],correctIndex:2},
{stem:"Which operator gives a scalar measure of a function's curvature and is used to abbreviate the wave equation?",choices:['Gradient','Curl','Divergence','The Laplacian (del-squared)'],correctIndex:3},
{stem:'Given u(x) = 3x^2 + 2x - 5, what does its Laplacian (second derivative) evaluate to?',choices:['6x + 2','6','3','0'],correctIndex:1},
{stem:'For u(x,t) = 5 cos(2x - 6t), which wave speed v makes the wave equation hold?',choices:['2','6','3','1/3'],correctIndex:2},
{stem:'Which of these functions does NOT satisfy the 1D wave equation (except trivially at t = 0)?',choices:['5 cos(2x - 6t)','u(x,t) = x^2 t','A cos(kx - wt)','A cos(kx + wt)'],correctIndex:1},
{stem:'For the traveling-wave solution u(x,t) = A cos(kx - wt), how is the phase speed v expressed using k and w?',choices:['v = k w','v = w / k','v = k / w','v = k + w'],correctIndex:1},
{stem:'Why does y(x,t) = A cos(kx - wt), and not A cos(kx + wt), describe a wave moving to the right?',choices:['Because the amplitude A has to be positive','Tracking a fixed point on the wave shows x must grow as t grows, which matches the minus sign','Because cosine is an even function','There is no real difference -- it is purely a labeling convention'],correctIndex:1},
{stem:'How is the wavenumber k connected to the wavelength lambda?',choices:['k = lambda / (2 pi)','k = 2 pi / lambda','k = 2 pi times lambda','k = lambda squared'],correctIndex:1},
{stem:'A sound source moves toward a stationary observer. What happens to the frequency the observer perceives?',choices:["It stays unchanged since the medium itself is unaffected",'It rises, because the wavelength gets compressed','It falls, because the wavelength gets stretched','It becomes infinite'],correctIndex:1},
{stem:"What happens physically once the source's speed equals the speed of sound (v = vs)?",choices:['The Doppler shift vanishes entirely',"The Doppler formula's denominator hits zero, producing a sonic boom",'The observer stops hearing anything at all','The wavelength grows without bound'],correctIndex:1},
{stem:'In the full Doppler relation f prime = f(v +/- vo)/(v -/+ vs), what happens if the observer retreats from the source at exactly the wave speed?',choices:['The frequency doubles','The numerator vanishes, so the observer hears silence','The frequency goes to infinity','Nothing changes at all'],correctIndex:1},
{stem:'What expression gives the half-angle of the Mach cone produced during a sonic boom?',choices:['cos(theta) = vs / v','sin(theta) = v / vs','tan(theta) = v times vs','sin(theta) = vs / v'],correctIndex:1},
{stem:'According to the chapter, the kinetic energy carried by an oscillating wave element scales with:',choices:['Amplitude alone','Frequency alone','The square of both the amplitude and the frequency together','The square root of the frequency'],correctIndex:2},
{stem:'When the Doppler effect makes a frequency sound higher, where does that extra energy actually come from?',choices:['The source spontaneously generates more energy','It comes purely from the relative motion between source and observer, not from new energy','Energy is destroyed in the process',"It is drawn from the medium's own internal energy"],correctIndex:1},
{stem:'Deriving the wave equation for a string with tension T and linear mass density mu produces which 1D wave equation?',choices:['d^2y/dt^2 = (mu/T) d^2y/dx^2','d^2y/dt^2 = (T/mu) d^2y/dx^2','d^2y/dx^2 = mu T d^2y/dt^2','d^2y/dt^2 = T mu d^2y/dx^2'],correctIndex:1},
{stem:'From that same string derivation, the phase speed of the wave is given by:',choices:['c = mu / T','c = sqrt(T / mu)','c = sqrt(mu / T)','c = T times mu'],correctIndex:1},
{stem:"What two quantities does Stokes' theorem connect?",choices:['The divergence of a field and a volume integral','A closed-loop line integral of a vector field and the surface integral of its curl','The gradient of a scalar field and a line integral','Two separate line integrals taken around different loops'],correctIndex:1},
{stem:"Taking the curl of Faraday's law and plugging in Ampere's law (vacuum) leads to which conclusion?",choices:['The electric field obeys a wave equation that propagates at the speed of light','The electric field becomes static and unchanging','The magnetic field vanishes entirely','Charges must be present for the wave to exist'],correctIndex:0},
{stem:'What does the Poynting vector S = E x H physically represent?',choices:['The force experienced per unit charge','The power per unit area (energy flux) carried by the E/M wave','The total enclosed charge','The wavelength of the E/M wave'],correctIndex:1}
];
let idx=0,score=0;
const p=document.getElementById('p'),s=document.getElementById('s'),o=document.getElementById('o'),f=document.getElementById('f');
function shuffleQuestions(){for(let i=quiz3.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[quiz3[i],quiz3[j]]=[quiz3[j],quiz3[i]];}}
function restartQuiz(){idx=0;score=0;shuffleQuestions();render();}
function render(){
document.getElementById('progress-bar').style.width=(idx/quiz3.length*100)+'%';
p.textContent=`Question ${idx+1} of ${quiz3.length} . Score: ${score}/${quiz3.length}`;
s.textContent=quiz3[idx].stem;o.innerHTML='';f.textContent='';
'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach((L,i)=>{if(i<quiz3[idx].choices.length){let b=document.createElement('button');b.className='q3_option';b.innerHTML='<b>'+L+')</b> '+quiz3[idx].choices[i];b.onclick=()=>ans(i);o.appendChild(b);}});
}
function ans(i){if(i===quiz3[idx].correctIndex){score++;f.className='correct';f.textContent='Correct!';setTimeout(()=>{idx++;if(idx<quiz3.length)render();else{p.textContent=`Completed . Final Score: ${score}/${quiz3.length}`;s.textContent='Quiz finished.';o.innerHTML='';f.textContent='Press Restart to try again.';}},500);}
else{f.className='incorrect';f.textContent='Incorrect -- restarting from Question 1...';setTimeout(restartQuiz,700);}}
document.getElementById('r').onclick=restartQuiz;
restartQuiz();
</script></body></html>
