<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EXP_Curl_Zero_vs_NonZero.html</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>

<style>
body {
    background-color: #1e1e1e;
    color: white;
    font-family: monospace;
    padding: 15px;
}
.editor {
    display: flex;
    border: 1px solid #444;
    height: 350px;
}
#lineNumbers {
    background: #111;
    color: #00ff00;
    padding: 10px 8px;
    margin: 0;
    text-align: right;
    overflow: hidden;
    white-space: pre;
}
#code {
    flex: 1;
    background: #111;
    color: white;
    border: none;
    padding: 10px;
    resize: none;
    overflow: auto;
    white-space: pre;
}
button {
    margin-top: 10px;
    margin-right: 6px;
    padding: 8px 14px;
    background: #007acc;
    color: white;
    border: none;
    cursor: pointer;
}
#output {
    background: #111;
    padding: 10px;
    margin-top: 10px;
    min-height: 80px;
    white-space: pre-wrap;
}
#plot {
    margin-top: 10px;
    border: 1px solid #555;
    max-width: 100%;
}
</style>
</head>

<body>

<h3>EXP_Curl_Zero_vs_NonZero</h3>

<div class="editor">
<pre id="lineNumbers"></pre>
<textarea id="code" wrap="off">import numpy as np
import matplotlib.pyplot as plt
import matplotlib

matplotlib.use("Agg")

plt.rcParams.update({
    'figure.facecolor': 'white',
    'axes.facecolor': 'white',
})

# ----------------------------------
# FIELD 1 : CURL = 0
# F = (x,y)
# ----------------------------------

# ----------------------------------
# FIELD 2 : CURL != 0
# F = (-y,x)
# ----------------------------------

x = np.linspace(-2,2,15)
y = np.linspace(-2,2,15)

X,Y = np.meshgrid(x,y)

# Curl = 0
U1 = X
V1 = Y

# Curl = 2
U2 = -Y
V2 = X

print("FIELD 1")
print("F=(x,y)")
print("curl = 0")
print("")

print("FIELD 2")
print("F=(-y,x)")
print("curl = 2")
print("")

plt.figure(figsize=(12,6))

plt.subplot(1,2,1)
plt.quiver(X,Y,U1,V1)
plt.title("F=(x,y), curl=0")
plt.axis("equal")

plt.subplot(1,2,2)
plt.quiver(X,Y,U2,V2)
plt.title("F=(-y,x), curl=2")
plt.axis("equal")

plt.tight_layout()

plt.savefig("plot.png")
plt.savefig("plot.pdf")
plt.savefig("plot.svg")</textarea>
</div>

<button onclick="runCode()">Run</button>
<button onclick="downloadPlot('png')">Download PNG</button>
<button onclick="downloadPlot('pdf')">Download PDF</button>
<button onclick="downloadPlot('svg')">Download SVG</button>

<div id="output"></div>
<img id="plot"/>

<script>
let pyodideReady = loadPyodide();
let pyodide;

const code = document.getElementById("code");
const lineNumbers = document.getElementById("lineNumbers");

function updateLineNumbers() {
    const lines = code.value.split("\n").length;
    let numbers = "";
    for (let i = 1; i <= lines; i++) numbers += i + "\n";
    lineNumbers.textContent = numbers;
}

code.addEventListener("input", updateLineNumbers);
code.addEventListener("scroll", () => lineNumbers.scrollTop = code.scrollTop);
updateLineNumbers();

async function runCode() {
    pyodide = await pyodideReady;

    document.getElementById("output").innerText = "Running...";
    document.getElementById("plot").src = "";

    await pyodide.loadPackage(["numpy","matplotlib"]);

    try {
        await pyodide.runPythonAsync(`
import sys
from io import StringIO
sys.stdout = StringIO()
`);

        await pyodide.runPythonAsync(code.value);
        let output = await pyodide.runPythonAsync("sys.stdout.getvalue()");
        document.getElementById("output").innerText = output;

        try {
            let img = pyodide.FS.readFile("plot.png", {encoding:"binary"});
            let blob = new Blob([img], {type:"image/png"});
            document.getElementById("plot").src = URL.createObjectURL(blob);
        } catch(e) {}
    } catch(err) {
        document.getElementById("output").innerText = err;
    }
}

function downloadPlot(format) {
    try {
        let file = pyodide.FS.readFile("plot." + format, {encoding:"binary"});
        let blob = new Blob([file], {type:"application/octet-stream"});
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "plot." + format;
        link.click();
    } catch(err) {
        alert("Run the code successfully first.");
    }
}
</script>

</body>
</html>
