
<style>
*{box-sizing:border-box;margin:0;padding:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.root{font-family:var(--font-sans);color:var(--color-text-primary);padding:.75rem 0}
.op-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.op-tab{font-size:12px;padding:5px 14px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;transition:all .15s;white-space:nowrap}
.op-tab:hover:not(.on){background:var(--color-background-secondary)}
.op-tab[data-op="grad"].on{background:#E6F1FB;color:#0C447C;border-color:#85B7EB}
.op-tab[data-op="lap"].on{background:#E1F5EE;color:#085041;border-color:#5DCAA5}
.op-tab[data-op="div"].on{background:#FAEEDA;color:#633806;border-color:#EF9F27}
.op-tab[data-op="curl"].on{background:#FBEAF0;color:#72243E;border-color:#ED93B1}
.op-tab.on{font-weight:500}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 215px;gap:.75rem;align-items:start}
canvas{display:block;width:100%;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);cursor:crosshair}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:.85rem 1rem;margin-bottom:.6rem}
.card h3{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.formula{font-family:var(--font-mono);font-size:12px;line-height:1.8;color:var(--color-text-primary)}
.meaning{font-size:12px;line-height:1.6;color:var(--color-text-secondary);margin-top:.45rem}
.obs{font-size:12px;line-height:1.6;color:var(--color-text-primary);margin-top:.3rem}
.pt-label{font-size:11px;color:var(--color-text-secondary);margin-bottom:.25rem}
.pt-val{font-family:var(--font-mono);font-size:12px;line-height:1.8;color:var(--color-text-primary)}
.leg-row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--color-text-secondary);margin-bottom:4px}
.leg-sw{width:30px;height:5px;border-radius:2px;flex-shrink:0}
hr{border:none;border-top:0.5px solid var(--color-border-tertiary);margin:.45rem 0}
</style>

<h2 class="sr-only">Vector calculus operator explorer with carefully chosen canonical fields for each operator</h2>

<div class="root">
  <div class="op-tabs">
    <button class="op-tab on"  data-op="grad">∇f  gradient</button>
    <button class="op-tab"     data-op="lap" >∇²f  Laplacian</button>
    <button class="op-tab"     data-op="div" >∇·F  divergence</button>
    <button class="op-tab"     data-op="curl">∇×F  curl</button>
  </div>

  <div class="layout">
    <div><canvas id="cv" role="img" aria-label="Colormap of the selected vector calculus operator"></canvas></div>
    <div>
      <div class="card" id="opCard"></div>
      <div class="card">
        <h3>at cursor</h3>
        <div class="pt-label" id="ptLabel">hover canvas</div>
        <div class="pt-val"   id="ptVal"> </div>
      </div>
      <div class="card">
        <h3>color key</h3>
        <div id="legWrap"></div>
      </div>
    </div>
  </div>
</div>

<script>
const DOM=2.8, h=0.0005, BGRID=70, NVEC=22;
let curOp="grad", mX=null, mY=null;

const OPS={
  grad:{
    label:"∇f — gradient",
    field:"f(x,y) = e^(−x²−y²)",
    formula:"∇f = (∂f/∂x, ∂f/∂y)",
    meaning:"Background = f. Arrows = ∇f: steepest-ascent direction, length = |∇f|.",
    observe:"Arrows point radially away from the peak. They vanish at (0,0) — gradient is zero at every critical point.",
  },
  lap:{
    label:"∇²f — Laplacian",
    field:"f(x,y) = e^(−x²−y²)",
    formula:"∇²f = ∂²f/∂x² + ∂²f/∂y²",
    meaning:"Scalar colormap only. Blue = concave down (max). Red = concave up (min). White = inflection.",
    observe:"Deep blue at the peak (∇²f < 0). A white ring marks the inflection circle. Red in the far field.",
  },
  div:{
    label:"∇·F — divergence",
    field:"F = (x, y)·e^(−x²−y²)",
    formula:"∇·F = ∂F_x/∂x + ∂F_y/∂y\n= (2−4x²−4y²)·e^(−x²−y²)",
    meaning:"Scalar colormap. Red = net outflow (source). Blue = net inflow (sink). Arrows show F itself.",
    observe:"Strong red source at origin. A blue annular sink ring surrounds it — field lines spread out then converge back. Total flux through any large circle = 0.",
  },
  curl:{
    label:"∇×F — curl (z-comp.)",
    field:"F(x,y) = (−y, x)·e^(−x²−y²)",
    formula:"(∇×F)_z = ∂F_y/∂x − ∂F_x/∂y\n= (2−2x²−2y²)·e^(−x²−y²)",
    meaning:"Scalar colormap. Red = CCW rotation. Blue = CW rotation. White = irrotational.",
    observe:"Strong CCW spin at origin (red core). Beyond radius 1, arrows still rotate but the curl turns negative (blue ring) — the spin field is weakening faster than it rotates.",
  },
};

const gauss=(x,y)=>Math.exp(-x*x-y*y);

function grad_f(x,y){
  const g=gauss(x,y);
  return[-2*x*g, -2*y*g];
}
function lap_f(x,y){
  const g=gauss(x,y);
  return(-4+4*x*x+4*y*y)*g;
}

const Fdiv =(x,y)=>{const g=gauss(x,y); return[x*g, y*g];};
function div_F(x,y){
  return(Fdiv(x+h,y)[0]-Fdiv(x-h,y)[0])/(2*h)
        +(Fdiv(x,y+h)[1]-Fdiv(x,y-h)[1])/(2*h);
}

const Fcurl=(x,y)=>{const g=gauss(x,y); return[-y*g, x*g];};
function curl_F(x,y){
  return(Fcurl(x+h,y)[1]-Fcurl(x-h,y)[1])/(2*h)
        -(Fcurl(x,y+h)[0]-Fcurl(x,y-h)[0])/(2*h);
}

function scalarAt(x,y){
  if(curOp==="grad")  return gauss(x,y);
  if(curOp==="lap")   return lap_f(x,y);
  if(curOp==="div")   return div_F(x,y);
  if(curOp==="curl")  return curl_F(x,y);
}

function cmSeq(t,dark){
  t=Math.max(0,Math.min(1,t));
  if(dark) return `rgb(${Math.round(15+t*55)},${Math.round(35+t*165)},${Math.round(70+t*175)})`;
  return `rgb(${Math.round(255-t*210)},${Math.round(255-t*100)},${Math.round(255-t*30)})`;
}
function cmDvg(t,dark){
  t=Math.max(-1,Math.min(1,t));
  if(dark){
    if(t>=0) return `rgb(${Math.round(20+t*30)},${Math.round(60+t*160)},${Math.round(80+t*140)})`;
    const s=-t; return `rgb(${Math.round(160+s*90)},${Math.round(40-s*30)},${Math.round(40-s*20)})`;
  }
  if(t>=0) return `rgb(${Math.round(240-t*220)},${Math.round(240-t*120)},255)`;
  const s=-t; return `rgb(255,${Math.round(240-s*200)},${Math.round(240-s*220)})`;
}

function drawArrow(ctx,sx,sy,nx,ny,len,col){
  if(len<1.5) return;
  const ex=sx+nx*len, ey=sy-ny*len;
  ctx.strokeStyle=col; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
  const ah=Math.min(len*0.38,6.5);
  const ang=Math.atan2(ey-sy,ex-sx);
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(ex,ey);
  ctx.lineTo(ex-ah*Math.cos(ang-0.42),ey-ah*Math.sin(ang-0.42));
  ctx.lineTo(ex-ah*Math.cos(ang+0.42),ey-ah*Math.sin(ang+0.42));
  ctx.closePath(); ctx.fill();
}

function draw(){
  const cv=document.getElementById("cv");
  const W=cv.parentElement.offsetWidth;
  const H=Math.round(W*0.74);
  const dpr=devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.width=W+"px"; cv.style.height=H+"px";
  const ctx=cv.getContext("2d");
  ctx.scale(dpr,dpr);
  const dark=matchMedia("(prefers-color-scheme:dark)").matches;

  const toSX=x=>(x+DOM)/(2*DOM)*W;
  const toSY=y=>H-(y+DOM)/(2*DOM)*H;
  const toWX=sx=>sx/W*(2*DOM)-DOM;
  const toWY=sy=>(1-sy/H)*(2*DOM)-DOM;
  const cw=W/BGRID, ch=H/BGRID;

  // ── scalar field values ──────────────────────────────────────────────
  const svals=[];
  for(let i=0;i<BGRID;i++) for(let j=0;j<BGRID;j++){
    const x=-DOM+(i+0.5)/BGRID*(2*DOM);
    const y=-DOM+(j+0.5)/BGRID*(2*DOM);
    svals.push(scalarAt(x,y));
  }
  const mn=Math.min(...svals), mx=Math.max(...svals);
  const maxAbs=Math.max(1e-9,...svals.map(v=>Math.abs(v)));
  const rng=Math.max(1e-9,mx-mn);

  // ── colormap ─────────────────────────────────────────────────────────
  let k=0;
  for(let i=0;i<BGRID;i++) for(let j=0;j<BGRID;j++){
    const v=svals[k++];
    ctx.fillStyle = curOp==="grad"
      ? cmSeq((v-mn)/rng, dark)
      : cmDvg(v/maxAbs, dark);
    ctx.fillRect(
      Math.floor(toSX(-DOM+i/BGRID*(2*DOM))),
      Math.floor(toSY(-DOM+(j+1)/BGRID*(2*DOM))),
      Math.ceil(cw)+1, Math.ceil(ch)+1);
  }

  // ── arrows: gradient vectors for grad; F vectors for div & curl ──────
  const Fvec = curOp==="grad"  ? (x,y)=>grad_f(x,y)
             : curOp==="div"   ? Fdiv
             : curOp==="curl"  ? Fcurl
             : null;

  if(Fvec){
    const vdata=[], mags=[];
    for(let i=0;i<NVEC;i++) for(let j=0;j<NVEC;j++){
      const x=-DOM+(i+0.5)/NVEC*(2*DOM);
      const y=-DOM+(j+0.5)/NVEC*(2*DOM);
      const [fx,fy]=Fvec(x,y);
      const mag=Math.sqrt(fx*fx+fy*fy);
      mags.push(mag); vdata.push({x,y,fx,fy,mag});
    }
    const maxMag=Math.max(1e-9,...mags);
    const aScale=W/NVEC*0.42;
    const isGrad=curOp==="grad";
    const ac = isGrad
      ? (dark?"rgba(255,255,255,0.88)":"rgba(10,60,130,0.9)")
      : (dark?"rgba(255,255,255,0.5)":"rgba(0,0,0,0.3)");
    for(const {x,y,fx,fy,mag} of vdata){
      if(mag<1e-10) continue;
      const len = isGrad ? (mag/maxMag)*aScale : Math.min(mag/maxMag,0.85)*aScale;
      drawArrow(ctx,toSX(x),toSY(y),fx/mag,fy/mag,len,ac);
    }
  }

  // ── axes ─────────────────────────────────────────────────────────────
  ctx.strokeStyle=dark?"rgba(255,255,255,0.14)":"rgba(0,0,0,0.11)";
  ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.moveTo(toSX(0),0); ctx.lineTo(toSX(0),H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,toSY(0)); ctx.lineTo(W,toSY(0)); ctx.stroke();
  ctx.fillStyle=dark?"rgba(255,255,255,0.38)":"rgba(0,0,0,0.32)";
  ctx.font="11px var(--font-mono,monospace)"; ctx.textAlign="center";
  ctx.fillText("x",W-9,toSY(0)-5);
  ctx.fillText("y",toSX(0)+10,11);

  // ── crosshair ────────────────────────────────────────────────────────
  if(mX!==null){
    ctx.strokeStyle=dark?"rgba(255,255,255,0.28)":"rgba(0,0,0,0.18)";
    ctx.lineWidth=0.8; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(mX,0); ctx.lineTo(mX,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,mY); ctx.lineTo(W,mY); ctx.stroke();
    ctx.setLineDash([]);
    updatePoint(toWX(mX),toWY(mY));
  }

  updateLegend(mn,mx,maxAbs,dark);
}

function updatePoint(wx,wy){
  document.getElementById("ptLabel").textContent=`(${wx.toFixed(2)}, ${wy.toFixed(2)})`;
  let html="";
  if(curOp==="grad"){
    const fv=gauss(wx,wy);
    const [gx,gy]=grad_f(wx,wy);
    html=`f = ${fv.toFixed(4)}<br>∂f/∂x = ${gx.toFixed(4)}<br>∂f/∂y = ${gy.toFixed(4)}<br>|∇f| = ${Math.sqrt(gx*gx+gy*gy).toFixed(4)}`;
  } else if(curOp==="lap"){
    html=`f = ${gauss(wx,wy).toFixed(4)}<br>∇²f = ${lap_f(wx,wy).toFixed(4)}`;
  } else if(curOp==="div"){
    const [fx,fy]=Fdiv(wx,wy);
    html=`F = (${fx.toFixed(4)}, ${fy.toFixed(4)})<br>∇·F = ${div_F(wx,wy).toFixed(4)}`;
  } else {
    const [fx,fy]=Fcurl(wx,wy);
    html=`F = (${fx.toFixed(4)}, ${fy.toFixed(4)})<br>curl = ${curl_F(wx,wy).toFixed(4)}`;
  }
  document.getElementById("ptVal").innerHTML=html;
}

function updateLegend(mn,mx,maxAbs,dark){
  const w=document.getElementById("legWrap");
  if(curOp==="grad"){
    w.innerHTML=`
      <div class="leg-row"><span class="leg-sw" style="background:${cmSeq(1,dark)}"></span><span>f = ${mx.toFixed(3)} (peak)</span></div>
      <div class="leg-row"><span class="leg-sw" style="background:${cmSeq(0.5,dark)}"></span><span>f = ${((mn+mx)/2).toFixed(3)}</span></div>
      <div class="leg-row"><span class="leg-sw" style="background:${cmSeq(0,dark)}"></span><span>f = ${mn.toFixed(3)} (far)</span></div>
      <hr><div style="font-size:11px;color:var(--color-text-secondary)">arrows = ∇f direction + |∇f|</div>`;
  } else {
    const hi=maxAbs.toFixed(4);
    w.innerHTML=`
      <div class="leg-row"><span class="leg-sw" style="background:${cmDvg(1,dark)}"></span><span>+${hi}</span></div>
      <div class="leg-row"><span class="leg-sw" style="background:${cmDvg(0,dark)}"></span><span>0</span></div>
      <div class="leg-row"><span class="leg-sw" style="background:${cmDvg(-1,dark)}"></span><span>−${hi}</span></div>
      ${curOp!=="lap"?'<hr><div style="font-size:11px;color:var(--color-text-secondary)">faint arrows = F(x,y) itself</div>':''}`;
  }
}

function updateOpCard(){
  const op=OPS[curOp];
  document.getElementById("opCard").innerHTML=`
    <h3>${op.label}</h3>
    <div style="font-size:11px;color:var(--color-text-secondary);margin-bottom:.35rem">${op.field}</div>
    <div class="formula">${op.formula.replace(/\n/g,"<br>")}</div>
    <hr>
    <div class="meaning">${op.meaning}</div>
    <hr>
    <div class="obs"><strong>What to see:</strong> ${op.observe}</div>`;
}

document.querySelectorAll(".op-tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    curOp=btn.dataset.op;
    document.querySelectorAll(".op-tab").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    updateOpCard(); draw();
  });
});

const cv=document.getElementById("cv");
cv.addEventListener("mousemove",e=>{
  const r=cv.getBoundingClientRect();
  mX=(e.clientX-r.left)*(cv.offsetWidth/r.width);
  mY=(e.clientY-r.top)*(cv.offsetHeight/r.height);
  draw();
});
cv.addEventListener("mouseleave",()=>{
  mX=null; mY=null;
  document.getElementById("ptLabel").textContent="hover canvas";
  document.getElementById("ptVal").textContent=" ";
  draw();
});

updateOpCard(); draw();
window.addEventListener("resize",draw);
</script>
